<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rapi">
  <!-- Favicon Rapi.
       Sengaja BUKAN maskot: di ukuran 16px detail wajahnya hilang dan cuma
       jadi gumpalan biru. Yang kepakai huruf "r" dari wordmark + titik ceria
       yang jadi aksen brand — titik yang sama dengan yang ada di huruf "i"
       pada logo dan di antena maskot.
       Yellow-di-Blue adalah satu dari 4 padanan warna resmi Brand Guidelines. -->
  <rect width="64" height="64" rx="16" fill="#0248C1" />
  <g stroke="#F8D613" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M23 46V27" />
    <path d="M23 31.5C23 24.5 28.5 22 35 22" />
  </g>
  <circle cx="47" cy="20" r="5.5" fill="#F8D613" />
</svg>
