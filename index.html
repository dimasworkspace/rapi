<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale + user-scalable=no: cubit-zoom bikin app kerasa halaman web.
         Ukuran teks bawaan sistem tetap dihormati, jadi aksesibilitas nggak dikorbankan. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111835" />
    <!-- PWA di iOS: ikon home screen + tampilan standalone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rapi" />
    <meta
      name="description"
      content="Rapi — catat keuangan tanpa ribet. Ketik, ngomong, atau foto struk: langsung kecatat rapi. #RapiinAja"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rapi — Catat Keuangan Tanpa Ribet</title>
    <script>
      // Terapkan tema & bahasa dari preferensi tersimpan SEBELUM render — cegah kedip
      try {
        var s = JSON.parse(localStorage.getItem('rapi-settings') || '{}').state || {}
        if (s.theme === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1020')
        }
        if (s.lang) document.documentElement.setAttribute('lang', s.lang)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
